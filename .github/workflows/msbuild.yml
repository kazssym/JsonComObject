# separate terms of service, privacy policy, and support
# documentation.
---
name: MSBuild

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  # Path to the NuGet global-packages folder.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

  VCPKG_BINARY_SOURCES: files,${{ github.workspace }}/.vcpkg/binary-cache,readwrite

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - uses: actions/cache@v6
      with:
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        path: ${{ env.NUGET_PACKAGES }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - uses: actions/cache@v6
      with:
        key: vcpkg-binary-cache-${{ hashFiles('**/vcpkg.json,**/vcpkg-configuration.json') }}
        path: ${{ env.GITHUB_WORKSPACE }}/.vcpkg/binary-cache
        restore-keys: |
          vcpkg-binary-cache-

    - name: Integrate Vcpkg
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: vcpkg integrate install
                
    - name: Update Vcpkg baseline
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: vcpkg x-update-baseline

    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}
